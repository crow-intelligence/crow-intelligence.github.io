name: Deploy Pelican site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Run the GitHub-maintained JavaScript actions on Node 24. They ship targeting
# Node 20, which the runner deprecates (forced to Node 24 from 2026-06-16). This
# opts in early so the deprecation warning is resolved ahead of the cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap's <lastmod> is the last commit date for each
      # source file (pelicanconf.py:_git_lastmod). A shallow clone has one
      # commit, so every page would report the same date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Test cookie consent + analytics gating
        run: npm test

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: pelican
        run: uv sync --frozen --no-dev

      - name: Build site
        working-directory: pelican
        run: uv run pelican content -s publishconf.py -o ../output

      - name: Copy asset directories into output
        run: |
          for dir in \
            .well-known \
            aporia altair_maps analysis charts countries countries_bump \
            countries_worldmap dashboard dashboard_portraits \
            embedding_graph endings external_css folium_maps \
            gexf-js gpt_test keresztnevek k-halo logos meghivo \
            music-networks nemenkent osszes population_trends \
            portraits punch qgis2web_2020_01_02-21_29_35_910844 \
            site socialmedia som települesenkent web; do
            if [ -d "$dir" ]; then
              cp -r "$dir" output/
              echo "  copied $dir/"
            fi
          done
          # Copy projects subdirectories
          for dir in projects/*/; do
            if [ -d "$dir" ]; then
              dirname=$(basename "$dir")
              cp -r "$dir" output/"$dirname"
              echo "  copied $dir -> output/$dirname/"
            fi
          done

      - name: Copy standalone files into output
        run: |
          for f in country_bumps.html maps_altair.html maps_folium.html robots.txt CNAME 404.html \
                   .nojekyll 438dd448fdaf7bb7ef5160d1c9bd78c6.txt \
                   consent.js google8f9e00ab937a5b17.html \
                   favicon.ico favicon.svg favicon-16.png favicon-32.png apple-touch-icon.png site.webmanifest; do
            if [ -f "$f" ]; then
              cp "$f" output/
              echo "  copied $f"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  # Tell IndexNow what changed. GitHub Pages gives us no deploy hook, so this
  # runs after deploy-pages and reads the URLs back off the live sitemaps —
  # which also means it can only submit what actually published.
  #
  # Bing matters here out of proportion to its traffic: its index is what backs
  # ChatGPT search and Copilot.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        env:
          HOST: crowintelligence.org
          KEY: 438dd448fdaf7bb7ef5160d1c9bd78c6
        run: |
          set -euo pipefail
          urls=$(
            for s in sitemap.xml sitemap-projects.xml; do
              curl -fsS --retry 3 "https://$HOST/$s" \
                | grep -o '<loc>[^<]*</loc>' \
                | sed 's|</\?loc>||g'
            done
          )
          count=$(printf '%s\n' "$urls" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "No URLs found in the live sitemaps - not submitting." >&2
            exit 1
          fi
          echo "Submitting $count URLs."
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -sc \
            --arg host "$HOST" --arg key "$KEY" \
            --arg loc "https://$HOST/$KEY.txt" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: .}')
          status=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")
          echo "IndexNow responded $status"
          cat /tmp/indexnow.out || true
          # 200 and 202 both mean accepted. Anything else is worth seeing in the
          # log, but a failed ping must not fail a deploy that already succeeded.
          case "$status" in 200|202) ;; *) echo "IndexNow submission not accepted." >&2 ;; esac
