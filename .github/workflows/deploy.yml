name: Deploy Pelican site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Run the GitHub-maintained JavaScript actions on Node 24. They ship targeting
# Node 20, which the runner deprecates (forced to Node 24 from 2026-06-16). This
# opts in early so the deprecation warning is resolved ahead of the cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Test cookie consent + analytics gating
        run: npm test

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: pelican
        run: uv sync --frozen --no-dev

      - name: Build site
        working-directory: pelican
        run: uv run pelican content -s publishconf.py -o ../output

      - name: Copy asset directories into output
        run: |
          for dir in \
            .well-known \
            aporia altair_maps analysis charts countries countries_bump \
            countries_worldmap dashboard dashboard_portraits \
            embedding_graph endings external_css folium_maps \
            gexf-js gpt_test keresztnevek k-halo logos meghivo \
            music-networks nemenkent osszes population_trends \
            portraits punch qgis2web_2020_01_02-21_29_35_910844 \
            site socialmedia som települesenkent web; do
            if [ -d "$dir" ]; then
              cp -r "$dir" output/
              echo "  copied $dir/"
            fi
          done
          # Copy projects subdirectories
          for dir in projects/*/; do
            if [ -d "$dir" ]; then
              dirname=$(basename "$dir")
              cp -r "$dir" output/"$dirname"
              echo "  copied $dir -> output/$dirname/"
            fi
          done

      - name: Copy standalone files into output
        run: |
          for f in country_bumps.html maps_altair.html maps_folium.html robots.txt CNAME 404.html \
                   consent.js google8f9e00ab937a5b17.html \
                   favicon.ico favicon.svg favicon-16.png favicon-32.png apple-touch-icon.png site.webmanifest; do
            if [ -f "$f" ]; then
              cp "$f" output/
              echo "  copied $f"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
