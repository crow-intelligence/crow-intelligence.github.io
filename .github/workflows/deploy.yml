name: Deploy Pelican site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pelican/requirements.txt

      - name: Build site
        working-directory: pelican
        run: pelican content -s publishconf.py -o ../output

      - name: Copy project assets into output
        run: |
          for dir in portraits site dashboard dashboard_portraits web analysis; do
            if [ -d "$dir" ]; then
              cp -r "$dir" output/
              echo "  copied $dir/"
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
