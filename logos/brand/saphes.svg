<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 150" width="550" height="150">
  <!-- Painted, not styled. A CSS background-color on the root is ignored by
       raster converters and by some embedders, which leaves the near-white
       wordmark invisible on a light surface. The #1A1B20 "hollow inner track"
       layer below also assumes this colour sits behind it. -->
  <rect width="550" height="150" fill="#1A1B20" />

  <defs>
    <!-- Multi-layered neon glow filter for realistic bloom -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Vertical Gradient for the Sigma (Lexical Diversity) -->
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/> <!-- Cyan -->
      <stop offset="100%" stop-color="#D946EF"/> <!-- Magenta -->
    </linearGradient>

    <!-- Path Definitions -->
    <g id="saphes-paths" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- The Sigma (Σ) representing 'saphes' and metric summation -->
      <path d="M 125,35 H 65 L 105,75 L 65,115 H 125" stroke="url(#sigmaGrad)" />
      
      <!-- The Line of Clarity cutting through the center vertex -->
      <path d="M 35,75 H 155" stroke="#F59E0B" /> <!-- Amber -->
    </g>
  </defs>

  <!-- LAYER 1: The Outer Neon Glow -->
  <use href="#saphes-paths" stroke-width="12" filter="url(#neonGlow)" opacity="0.9" />
  
  <!-- LAYER 2: The Solid Outer Path (Ensures core colors stay vibrant) -->
  <use href="#saphes-paths" stroke-width="12" />

  <!-- LAYER 3: The Hollow Inner Track (Carves out the center using the background color) -->
  <!-- This seamlessly merges the intersections of the Sigma and the straight line -->
  <use href="#saphes-paths" stroke="#1A1B20" stroke-width="3.5" />

  <!-- LAYER 4: The Terminal Nodes (White glowing data points) -->
  <g fill="#FFFFFF">
    <!-- Sigma Nodes -->
    <circle cx="125" cy="35" r="3" />
    <circle cx="65" cy="35" r="3" />
    <circle cx="65" cy="115" r="3" />
    <circle cx="125" cy="115" r="3" />
    
    <!-- Central Intersection Node -->
    <circle cx="105" cy="75" r="4.5" />

    <!-- Clarity Line Terminals -->
    <circle cx="35" cy="75" r="3" />
    <circle cx="155" cy="75" r="3" />
  </g>

  <!-- Typography -->
  <text x="185" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ECF0F1" letter-spacing="-1">saphes</text>
  
  <!-- Subtitle -->
  <text x="188" y="110" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1">readability &amp; lexical diversity</text>
</svg>
