<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>The Nagel Index — George Washington</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.1.2/wordcloud2.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue: #3B8BD4;
    --blue-light: #5CA3E2;
    --blue-dim: rgba(59,139,212,0.18);
    --amber: #BA7517;
    --amber-light: #D4912A;
    --amber-dim: rgba(186,117,23,0.18);
    --coral: #D85A30;
    --gray-ns: #888780;
    --bg: #1A1A1E;
    --bg-card: #232328;
    --bg-stat: #1E1E22;
    --text: #E8E4DC;
    --text-dim: #9C998F;
    --serif: 'IM Fell English', Georgia, serif;
    --mono: 'Courier Prime', 'Courier New', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .canvas {
    width: 1200px;
    height: 800px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* === TOP BANNER === */
  .banner {
    text-align: center;
    padding: 22px 0 10px;
    border-bottom: 1px solid rgba(232,228,220,0.08);
    flex-shrink: 0;
  }
  .banner-title {
    font-family: var(--serif);
    font-size: 15px;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .banner-subject {
    font-family: var(--serif);
    font-size: 26px;
    color: var(--text);
    letter-spacing: 0.04em;
  }
  .banner-subject span {
    color: var(--text-dim);
    font-size: 18px;
    margin-left: 8px;
    font-style: italic;
  }

  /* === MAIN AREA === */
  .main {
    flex: 1;
    display: flex;
    min-height: 0;
    padding: 14px 28px 10px;
    gap: 28px;
  }

  /* Left panel — radar */
  .panel-left {
    width: 480px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }
  .panel-left h3 {
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .radar-wrap {
    position: relative;
    width: 440px;
    height: 420px;
  }
  #radarChart {
    width: 440px !important;
    height: 420px !important;
  }
  .legend {
    display: flex;
    gap: 24px;
    margin-top: 2px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 2px;
  }

  /* Right panel — word clouds */
  .panel-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
  }
  .wc-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border-radius: 8px;
    padding: 10px 14px;
    min-height: 0;
  }
  .wc-section h4 {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
    flex-shrink: 0;
  }
  .wc-section h4.pub { color: var(--blue); }
  .wc-section h4.priv { color: var(--amber); }
  .wc-canvas-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  .wc-canvas-wrap canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100% !important;
    height: 100% !important;
  }

  /* === BOTTOM STATS BAR === */
  .stats-bar {
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 0 28px 18px;
    height: 108px;
  }
  .stat-col {
    flex: 1;
    background: var(--bg-stat);
    border-right: 1px solid rgba(232,228,220,0.05);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .stat-col:first-child { border-radius: 6px 0 0 6px; }
  .stat-col:last-child { border-radius: 0 6px 6px 0; border-right: none; }
  .stat-col.overall {
    background: #28282E;
    min-width: 168px;
    flex: 0 0 168px;
    align-items: center;
    text-align: center;
  }
  .stat-trait {
    font-family: var(--serif);
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--text);
    margin-bottom: 4px;
    white-space: nowrap;
  }
  .stat-row {
    display: flex;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10.5px;
    line-height: 1.5;
  }
  .stat-pub { color: var(--blue-light); }
  .stat-priv { color: var(--amber-light); }
  .stat-p {
    font-family: var(--mono);
    font-size: 10px;
  }
  .stat-p.sig { color: var(--coral); }
  .stat-p.ns { color: var(--gray-ns); }
  .stat-d {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
  }
  .overall-label {
    font-family: var(--serif);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-variant: small-caps;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .overall-score {
    font-family: var(--mono);
    font-size: 32px;
    font-weight: 700;
    color: var(--coral);
    line-height: 1.1;
  }
  .overall-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="canvas" id="canvas">

  <!-- BANNER -->
  <div class="banner">
    <div class="banner-title">The Nagel Index</div>
    <div class="banner-subject">George Washington <span>1789-1797</span></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- LEFT: Radar -->
    <div class="panel-left">
      <h3>Big Five Profile Overlay</h3>
      <div class="radar-wrap">
        <canvas id="radarChart"></canvas>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:var(--blue);"></div> Public voice</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--amber);"></div> Private voice</div>
      </div>
    </div>

    <!-- RIGHT: Word Clouds -->
    <div class="panel-right">
      <div class="wc-section">
        <h4 class="pub">Public Vocabulary</h4>
        <div class="wc-canvas-wrap"><canvas id="wcPublic"></canvas></div>
      </div>
      <div class="wc-section">
        <h4 class="priv">Private Vocabulary</h4>
        <div class="wc-canvas-wrap"><canvas id="wcPrivate"></canvas></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM STATS BAR -->
  <div class="stats-bar" id="statsBar"></div>
</div>

(function drawRadar() {

          angleLines: {

          const t = traits[trait];
          const midVal = (t.public_mean + t.private_mean) / 2;
          const angle = scale.getIndexAngle(i) - Math.PI / 2;
          const dist = scale.getDistanceFromCenterForValue(midVal);
          const x = cx + Math.cos(angle) * dist * 0.68;
          const y = cy + Math.sin(angle) * dist * 0.68;

          const d = t.cohens_d;
          const dStr = (d >= 0 ? '+' : '') + d.toFixed(1);

          ctx.save();
          ctx.font = "bold 10px 'Courier Prime', monospace";
          ctx.fillStyle = t.significant ? CORAL : GRAY_NS;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(dStr, x, y);
          ctx.restore();
        });
      }
    }]
  });
})();

// ============================================================
// WORD CLOUDS
// ============================================================
function drawWordCloud(canvasId, words, colorBase) {
  const canvas = document.getElementById(canvasId);
  const wrap = canvas.parentElement;

  // Set canvas dimensions to match container
  canvas.width = wrap.offsetWidth * 2;
  canvas.height = wrap.offsetHeight * 2;
  canvas.style.width = wrap.offsetWidth + 'px';
  canvas.style.height = wrap.offsetHeight + 'px';

  const maxFreq = Math.max(...words.map(w => w.frequency));
  const minSize = 10;
  const maxSize = 52;

  // Build color palette — vary hue slightly for visual interest
  const hsl = colorBase === 'blue'
    ? (i) => `hsl(${210 + (i % 5) * 4}, ${60 + (i % 3) * 10}%, ${55 + (i % 4) * 5}%)`
    : (i) => `hsl(${36 + (i % 5) * 3}, ${65 + (i % 3) * 8}%, ${48 + (i % 4) * 6}%)`;

  const list = words.map((w, i) => [
    w.word,
    minSize + (w.frequency / maxFreq) * (maxSize - minSize)
  ]);

  WordCloud(canvas, {
    list: list,
    gridSize: 6,
    weightFactor: 2,
    fontFamily: "'IM Fell English', Georgia, serif",
    color: function(word, weight, fontSize, distance, theta) {
      const idx = list.findIndex(l => l[0] === word);
      return hsl(idx >= 0 ? idx : 0);
    },
    backgroundColor: 'transparent',
    rotateRatio: 0.25,
    rotationSteps: 3,
    shuffle: false,
    drawOutOfBound: false,
    shrinkToFit: true
  });
}

// Small delay to let layout settle before rendering word clouds
setTimeout(() => {
  drawWordCloud('wcPublic', DATA.wordfreq.public, 'blue');
  drawWordCloud('wcPrivate', DATA.wordfreq.private, 'amber');
}, 300);

// ============================================================
// STATS BAR
// ============================================================
(function drawStats() {
  const bar = document.getElementById('statsBar');
  const traits = DATA.stats.traits;

  TRAITS.forEach(trait => {
    const t = traits[trait];
    const col = document.createElement('div');
    col.className = 'stat-col';

    const sigClass = t.significant ? 'sig' : 'ns';
    const pStr = fmtP(t.mwu_p);
    const dStr = 'd=' + (t.cohens_d >= 0 ? '+' : '') + t.cohens_d.toFixed(2);

    col.innerHTML = `
      <div class="stat-trait">${trait}</div>
      <div class="stat-row">
        <span class="stat-pub">${t.public_mean.toFixed(2)}</span>
        <span style="color:#555">|</span>
        <span class="stat-priv">${t.private_mean.toFixed(2)}</span>
      </div>
      <div class="stat-p ${sigClass}">${pStr}</div>
      <div class="stat-d">${dStr} (${t.effect_size})</div>
    `;
    bar.appendChild(col);
  });

  // Overall score column
  const overall = document.createElement('div');
  overall.className = 'stat-col overall';
  overall.innerHTML = `
    <div class="overall-label">Overall Nagel Gap</div>
    <div class="overall-score">${DATA.stats.overall_nagel_gap_score.toFixed(2)}</div>
    <div class="overall-sub">n=${DATA.stats.n_public_chunks} pub / ${DATA.stats.n_private_chunks} priv</div>
  `;
  bar.appendChild(overall);
})();
