<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="100%" stop-color="#24242b"/>
    </linearGradient>
    <linearGradient id="line1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3498db" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#2ecc71"/>
      <stop offset="55%" stop-color="#e67e22"/>
      <stop offset="80%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#e74c3c" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="560" height="440" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#3a3a44" stroke-width="0.5" opacity="0.4">
    <line x1="60" y1="100" x2="520" y2="100"/>
    <line x1="60" y1="160" x2="520" y2="160"/>
    <line x1="60" y1="220" x2="520" y2="220"/>
    <line x1="60" y1="280" x2="520" y2="280"/>
    <line x1="60" y1="340" x2="520" y2="340"/>
  </g>

  <!-- Title -->
  <text x="280" y="45" text-anchor="middle" fill="#e8c97e" font-size="22" font-weight="bold" font-family="Georgia, serif">Market Metaphors</text>
  <text x="280" y="68" text-anchor="middle" fill="#9a988f" font-size="11" font-style="italic" font-family="Georgia, serif">Kindleberger Phases × Narrative Economics</text>

  <!-- Phase labels at bottom -->
  <text x="130" y="380" text-anchor="middle" fill="#3498db" font-size="9" opacity="0.8">DISPLACEMENT</text>
  <text x="250" y="380" text-anchor="middle" fill="#2ecc71" font-size="9" opacity="0.8">BOOM</text>
  <text x="370" y="380" text-anchor="middle" fill="#e67e22" font-size="9" opacity="0.8">DISTRESS</text>
  <text x="470" y="380" text-anchor="middle" fill="#e74c3c" font-size="9" opacity="0.8">REVULSION</text>

  <!-- Metaphor density area chart -->
  <path d="M60,320 C100,310 130,280 170,250 C210,220 240,180 280,150 C310,130 340,140 370,190 C400,240 430,290 470,310 C490,320 510,325 520,330 L520,340 L60,340 Z"
        fill="url(#line1)" opacity="0.15"/>
  <path d="M60,320 C100,310 130,280 170,250 C210,220 240,180 280,150 C310,130 340,140 370,190 C400,240 430,290 470,310 C490,320 510,325 520,330"
        fill="none" stroke="url(#line1)" stroke-width="2.5"/>

  <!-- Metaphor domain dots scattered -->
  <!-- Ascent/Growth metaphors -->
  <circle cx="180" cy="260" r="4" fill="#2ecc71" opacity="0.7"/>
  <circle cx="220" cy="230" r="5" fill="#2ecc71" opacity="0.8"/>
  <circle cx="260" cy="190" r="6" fill="#2ecc71" opacity="0.7"/>
  <circle cx="290" cy="160" r="4" fill="#2ecc71" opacity="0.6"/>

  <!-- Heat metaphors -->
  <circle cx="300" cy="175" r="5" fill="#e74c3c" opacity="0.7"/>
  <circle cx="340" cy="155" r="6" fill="#e74c3c" opacity="0.8"/>
  <circle cx="360" cy="200" r="4" fill="#e74c3c" opacity="0.6"/>

  <!-- Water metaphors -->
  <circle cx="100" cy="310" r="4" fill="#3498db" opacity="0.7"/>
  <circle cx="140" cy="280" r="5" fill="#3498db" opacity="0.8"/>
  <circle cx="400" cy="260" r="5" fill="#3498db" opacity="0.7"/>

  <!-- Light metaphors -->
  <circle cx="200" cy="245" r="4" fill="#f39c12" opacity="0.7"/>
  <circle cx="240" cy="200" r="5" fill="#f39c12" opacity="0.8"/>

  <!-- Weight metaphors -->
  <circle cx="420" cy="285" r="5" fill="#9b59b6" opacity="0.7"/>
  <circle cx="450" cy="305" r="4" fill="#9b59b6" opacity="0.6"/>

  <!-- Crisis event markers -->
  <line x1="150" y1="90" x2="150" y2="340" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="270" y1="90" x2="270" y2="340" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="380" y1="90" x2="380" y2="340" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  <line x1="440" y1="90" x2="440" y2="340" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Stats bar -->
  <rect x="60" y="400" width="460" height="30" rx="4" fill="#2e2e37"/>
  <text x="130" y="420" text-anchor="middle" fill="#e8c97e" font-size="10">158,666 headlines</text>
  <text x="280" y="420" text-anchor="middle" fill="#9a988f" font-size="10">2009–2020</text>
  <text x="430" y="420" text-anchor="middle" fill="#e8c97e" font-size="10">8 metaphor domains</text>

  <!-- Legend dots -->
  <circle cx="80" cy="95" r="4" fill="#2ecc71"/>
  <text x="90" y="99" fill="#9a988f" font-size="8">Ascent</text>
  <circle cx="135" cy="95" r="4" fill="#e74c3c"/>
  <text x="145" y="99" fill="#9a988f" font-size="8">Heat</text>
  <circle cx="180" cy="95" r="4" fill="#3498db"/>
  <text x="190" y="99" fill="#9a988f" font-size="8">Water</text>
  <circle cx="230" cy="95" r="4" fill="#f39c12"/>
  <text x="240" y="99" fill="#9a988f" font-size="8">Light</text>
  <circle cx="275" cy="95" r="4" fill="#9b59b6"/>
  <text x="285" y="99" fill="#9a988f" font-size="8">Weight</text>
</svg>