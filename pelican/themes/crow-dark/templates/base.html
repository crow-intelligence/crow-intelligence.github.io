<!DOCTYPE html>
<html lang="{% if page is defined and page and page.lang %}{{ page.lang }}{% else %}{{ DEFAULT_LANG }}{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Independent research at the intersection of cognitive linguistics, NLP, and data analysis.{% endblock %}">
    <meta name="author" content="{{ AUTHOR }}">
    <meta name="robots" content="{% block meta_robots %}index, follow{% endblock %}">
    <link rel="canonical" href="{% block canonical_url %}{{ SITEURL }}/{% endblock %}">

    <!-- RSS auto-discovery: essays and research projects -->
    <link rel="alternate" type="application/rss+xml" title="Crow Intelligence" href="{{ SITEURL }}/feed.xml">

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph -->
    <meta property="og:site_name" content="{{ SITENAME }}">
    <meta property="og:locale" content="{% if page is defined and page and page.lang == 'hu' %}hu_HU{% else %}{{ OG_LOCALE }}{% endif %}">
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:title" content="{% block og_title %}{{ SITENAME }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Independent research at the intersection of cognitive linguistics, NLP, and data analysis.{% endblock %}">
    <meta property="og:image" content="{% block og_image %}{{ SITEURL }}/site/img/punctuation_spiral.png{% endblock %}">
    <meta property="og:url" content="{% block og_url %}{{ SITEURL }}/{% endblock %}">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ SITENAME }}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}Independent research at the intersection of cognitive linguistics, NLP, and data analysis.{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ SITEURL }}/site/img/punctuation_spiral.png{% endblock %}">

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ResearchOrganization",
      "@id": "{{ SITEURL }}/#organization",
      "name": "Crow Intelligence",
      "url": "{{ SITEURL }}/",
      "logo": "{{ SITEURL }}/{{ LOGO_PATH }}",
      "description": "Independent Research in Language, Cognition & AI",
      "email": "hello@crowintelligence.org",
      "founder": [
        {
          "@type": "Person",
          "name": "Zoltán Varjú",
          "jobTitle": "Founder & AI Advisor",
          "worksFor": { "@id": "{{ SITEURL }}/#organization" },
          "sameAs": [
            "https://bsky.app/profile/zoltanv.bsky.social",
            "https://mindtheminds.substack.com/",
            "https://www.linkedin.com/in/zoltanvarju"
          ]
        },
        {
          "@type": "Person",
          "name": "Orsolya Putz, PhD",
          "jobTitle": ["Partner & Cognitive Scientist", "Assistant Professor"],
          "worksFor": { "@id": "{{ SITEURL }}/#organization" },
          "affiliation": {
            "@type": "Organization",
            "name": "Budapest University of Technology and Economics (BME)",
            "url": "https://www.bme.hu/",
            "department": {
              "@type": "Organization",
              "name": "Department of Telecommunications and Artificial Intelligence",
              "url": "https://www.tmit.bme.hu/"
            }
          },
          "sameAs": [
            "https://www.linkedin.com/in/orsolya-putz-phd-5242a5157",
            "https://www.tmit.bme.hu/putz.orsolya"
          ]
        }
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Services",
        "itemListElement": [
          {%- for service in SERVICES %}
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": {{ service.title|tojson }},
              "description": {{ service.description|tojson }},
              "url": "{{ SITEURL }}{{ service.url }}",
              "serviceType": {{ service.label|tojson }},
              "provider": { "@id": "{{ SITEURL }}/#organization" },
              "areaServed": "EU"
            }
          }{{ "," if not loop.last }}
          {%- endfor %}
        ]
      },
      "sameAs": [
        "https://github.com/crow-intelligence",
        "https://bsky.app/profile/zoltanv.bsky.social",
        "https://mindtheminds.substack.com/"
      ]
    }
    </script>
    {% block extra_schema %}{% endblock %}

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/{{ THEME_STATIC_DIR }}/css/style.css">

    <!-- Cookie consent + analytics loader. Analytics stays blocked until opt-in. -->
    <script defer src="/consent.js"></script>
</head>
<body>
    <header>
        <nav class="main-nav">
            <div class="container">
                <a href="{{ SITEURL }}/" class="nav-brand" aria-label="{{ SITENAME }}">
                    <img src="/logos/brand/crow-nav.svg" alt="{{ SITENAME }}">
                </a>
                <button class="nav-toggle" aria-label="Toggle navigation">
                    <span></span><span></span><span></span>
                </button>
                <div class="nav-links">
                    {% for title, link in MENUITEMS %}
                    <a href="{% if link.startswith('http') %}{{ link }}{% else %}{{ SITEURL }}{{ link }}{% endif %}">{{ title }}</a>
                    {% endfor %}
                </div>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div class="footer-logo">
                <img src="/{{ LOGO_PATH }}" alt="{{ SITENAME }} Logo">
            </div>
            <p>&copy; 2026 {{ SITENAME }}. All rights reserved.</p>
            <p class="footer-links">
                <a href="{{ SITEURL }}/privacy.html">Privacy</a>
                <a href="{{ SITEURL }}/terms.html">Terms</a>
                <a href="#" onclick="if(window.CrowConsent){window.CrowConsent.open();}return false;">Cookie settings</a>
            </p>
        </div>
    </footer>

    <script>
        document.querySelector('.nav-toggle').addEventListener('click', function() {
            document.querySelector('.nav-links').classList.toggle('open');
        });
    </script>
</body>
</html>
