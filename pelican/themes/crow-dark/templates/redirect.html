<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }} — {{ SITENAME }}</title>
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url={{ SITEURL }}{{ page.redirect }}">
    <link rel="canonical" href="{{ SITEURL }}{{ page.redirect }}">
    <script>
        window.location.replace('{{ SITEURL }}{{ page.redirect }}' + window.location.search + window.location.hash);
    </script>
</head>
<body>
    <p>This page has moved to <a href="{{ SITEURL }}{{ page.redirect }}">{{ page.redirect }}</a>.</p>
</body>
</html>
